# quota-router-for-gemini (DESIGN §21.2).
#   docker compose up -d --build            run the proxy on http://127.0.0.1:4000
#   docker compose run --build --rm test    run the test suite (no network)
#   docker compose --profile monitoring up -d   also start Prometheus and Grafana (§21.6)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  quota-router:
    build:
      context: .
      target: runtime
    image: quota-router-for-gemini:local
    env_file: .env
    environment:
      # Override whatever .env says: inside the container the proxy must listen on all
      # interfaces and port 4000; only the 127.0.0.1 publish below makes it reachable.
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: "4000"
      QR_CONFIG: /app/config.yaml
      # `quota-router` lets the monitoring profile's Prometheus pass the Host guard;
      # names from .env (e.g. a Tailscale name) are kept.
      PROXY_ALLOWED_HOSTS: quota-router${PROXY_ALLOWED_HOSTS:+,${PROXY_ALLOWED_HOSTS}}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # If ./config.yaml is missing, Docker creates an empty folder in its place and the
      # proxy stops with a startup error saying how to fix it (`rmdir config.yaml`).
      - ./config.yaml:/app/config.yaml:ro
      - qr-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Idles at ~50 MB; room for a few 20 MB request bodies at once (DESIGN §21.2).
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging

  test:
    profiles: [test]
    build:
      context: .
      target: test
    image: quota-router-for-gemini:test
    network_mode: none
    logging: *logging

  # ---- optional: docker compose --profile monitoring up -d (DESIGN §21.6) ----
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - proxy_token
    # Not published: only Grafana reads it, over the compose network.
    depends_on: [quota-router]
    # Not read_only: Compose can't place an environment-sourced secret in a read-only container.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Idles at ~30 MB with this repo's few series. Without a limit Docker Desktop shows the
    # whole VM's memory as this container's limit.
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  grafana:
    profiles: [monitoring]
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    # Refuse to start without an admin password. A `${VAR:?}` check can't be used: Compose
    # evaluates it even when this profile is off, which would break plain `docker compose up`.
    entrypoint: ["sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'grafana: set GRAFANA_ADMIN_PASSWORD in .env' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # No calls home: usage reporting, update checks and the news feed are off.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/quota-router.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m          # about 245 MB once warmed up
    restart: unless-stopped
    logging: *logging

secrets:
  proxy_token:
    environment: PROXY_TOKEN   # read from .env by Compose; not copied into another file

volumes:
  qr-data:
  prometheus-data:
  grafana-data:
