# Scrapes the proxy's /metrics over the compose network (DESIGN §21.6).
# The bearer token comes from the `proxy_token` compose secret (sourced from PROXY_TOKEN).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: quota-router
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/proxy_token
    static_configs:
      - targets: ["quota-router:4000"]
