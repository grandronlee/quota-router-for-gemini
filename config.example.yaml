# Copy to config.yaml (ignored by git) and fill in your own project's limits from
# AI Studio → Rate Limit. Limits differ between accounts and change over time (DESIGN §2, §19).
#
# rpm / tpm_input / rpd: leave a value empty (e.g. `rpd:`) only if AI Studio shows no limit;
# the key itself must stay. input_limit / output_limit come from models.list.
# first_byte_timeout_s (optional, 1-120, default 120): how long to wait for a model's first
# byte before falling back (DESIGN §24.2). A timed-out request still uses one of the model's
# daily requests, so set it only well above the first_byte_ms of its successful answers.

upstream_base_url: https://generativelanguage.googleapis.com/v1beta/openai/
custom_upstream: false        # the API key goes to upstream_base_url; true only for an endpoint you trust
request_deadline_s: 180
max_attempts: 3
db_path: data/quota.sqlite3   # RPD counts, exhausted state, tool affinity
billing: free                 # the only supported value: use a key from a project without billing
max_body_bytes: 20971520      # 20 MB per request
max_inflight_parsed_bytes: 134217728  # 128 MB: estimated memory of all request bodies at once (DESIGN §20.3)

models:
  hydrogen-4: { id: gemini-4-hydrogen, rpm: 5, tpm_input: 250000, rpd: 20,
                input_limit: 1048576, output_limit: 65536 }
  # flash-3-8: { id: gemini-3.8-flash, rpm: 5, tpm_input: 250000, rpd: 20,
  #              input_limit: 1048576, output_limit: 65536 }   # tool call not passed yet (503)
  flash-3-6: { id: gemini-3.6-flash, rpm: 5, tpm_input: 250000, rpd: 20,
               input_limit: 1048576, output_limit: 65536 }
  flash-3: { id: gemini-3-flash-preview, rpm: 5, tpm_input: 250000, rpd: 20,
             input_limit: 1048576, output_limit: 65536 }
  flash-2-5: { id: gemini-2.5-flash, rpm: 5, tpm_input: 250000, rpd: 20,
               input_limit: 1048576, output_limit: 65536 }
  lite-3-5: { id: gemini-3.5-flash-lite, rpm: 15, tpm_input: 250000, rpd: 500,
              input_limit: 1048576, output_limit: 65536 }
  lite-3-1: { id: gemini-3.1-flash-lite, rpm: 15, tpm_input: 250000, rpd: 500,
              input_limit: 1048576, output_limit: 65536 }
  lite-2-5: { id: gemini-2.5-flash-lite, rpm: 10, tpm_input: 250000, rpd: 20,
              input_limit: 1048576, output_limit: 65536 }

routes:
  gemini-fast: [lite-3-5]     # add lite-3-1 once its tool call passes the probe
  # Planning and debugging (Zoo Code Architect/Debug). DESIGN §4 order, limited to models
  # whose tool call passed the probe: add flash-3-8 and lite-3-1 once theirs pass.
  gemini-smart: [hydrogen-4, flash-3-6, flash-3, flash-2-5, lite-3-5, lite-2-5]

# Models whose multi-step handoff probe passed with the placeholder signature (DESIGN §16.8 1a,
# docs/probe-results.md). Add hydrogen-4 and flash-3-6 only after `probe.py --handoffs` passes them.
handoff_targets: [flash-3, flash-2-5, lite-3-5, lite-2-5]
handoff_after_s: 60           # hand a tool turn off only if its model is blocked longer
# Hold a request for up to this many seconds when only the proxy's own per-minute count
# (RPM or TPM) blocks it, instead of answering 429 (DESIGN §25). Off by default: it makes
# first bytes slower for every client of the proxy. Needs hold_max_s + 5 <= request_deadline_s.
# hold_max_s: 60

# One route that picks the tier for each turn (DESIGN §16.9). A turn uses the fast tier unless
# the smart tier has more quota left than the rest of the day's demand is expected to use; when
# either tier runs out, the turn spills into the other. Uncomment to use, and set your timezone.
# auto:
#   name: gemini-auto
#   tiers:                     # best first within each tier; a model may be in one tier only
#     smart: [hydrogen-4, flash-3-6, flash-3, flash-2-5]
#     fast: [lite-3-5, lite-2-5]
#   default_tier: fast
#   pacing:
#     tier: smart
#     reserve: 5               # requests kept back, shrinking to 0 as the day's demand ends
#     working_hours: "09:00-18:00"   # used until 7 days of demand are measured
#     timezone: "America/New_York"   # your IANA time zone
#   # Optional rules (DESIGN §16.10.2), first match wins. A rule naming the paced tier starts
#   # its turns there until the pool is `reserve` requests past the pace line, then on the
#   # default tier (`paced`); a rule naming another tier keeps its turns there. Prefixes are
#   # literal and case-sensitive, matched at the start of any line of the system prompt.
#   # These match Zoo Code 3.98.2 (docs/probe-results.md); other clients need their own.
#   # rules:
#   #   - name: task-title     # Zoo Code's small, tool-less title request
#   #     when: { max_tools: 0, max_input_tokens: 500 }
#   #     tier: fast
#   #   - name: planning-mode  # Architect and Orchestrator
#   #     when:
#   #       system_line_prefix:
#   #         - "You are Zoo, an experienced technical leader"
#   #         - "You are Zoo, a strategic workflow orchestrator"
#   #     tier: smart
